<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="bible">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>bible</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="debug-console" style="position: fixed; top: 0; left: 0; width: 100%; height: 50%; background: rgba(0,0,0,0.8); color: lime; overflow: auto; z-index: 9999; display: none; padding: 20px; font-family: monospace;">
    <h3>Debug Console</h3>
    <ul id="debug-list"></ul>
  </div>

  <script>
    // Simple on-screen logger for debugging blank white screens
    var debugConsole = document.getElementById('debug-console');
    var debugList = document.getElementById('debug-list');

    function logError(msg) {
      debugConsole.style.display = 'block';
      var li = document.createElement('li');
      li.textContent = msg;
      debugList.appendChild(li);
      console.error(msg);
    }

    window.onerror = function (message, source, lineno, colno, error) {
      logError("Global Error: " + message + " at " + source + ":" + lineno);
    };

    window.addEventListener('unhandledrejection', function(event) {
      logError("Unhandled Rejection: " + event.reason);
    });

    // Timeout alert if Flutter doesn't load in 5 seconds
    setTimeout(function() {
      if (!window._flutter) {
        // Checking if flutter object exists (depends on version, but generic check)
        // Actually, just checking if body is still empty-ish
        // logic: if flutter is running, it usually modifies DOM.
        // Let's just log a 'timeout check' note
        // logError("Timeout Check: Flutter engine hasn't reported ready yet (ignore if app is running).");
      }
    }, 5000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
